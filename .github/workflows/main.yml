name: download-ff-ipa
on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install ipatool
        run: |
          go install github.com/majd/ipatool/v2@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Auth with Apple ID
        env:
          APPLE_EMAIL: ${{ secrets.APPLE_EMAIL }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: |
          echo ">>> Logando com senha de app..."
          ipatool auth login -e "$APPLE_EMAIL" -p "$APPLE_PASSWORD" --keychain-passphrase "ollie"

      - name: Download Free Fire IPA
        run: |
          mkdir -p ipa
          ipatool download -b com.dts.freefireth -o ipa/FreeFire.ipa --keychain-passphrase "ollie"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: freefire-original-ipa
          path: ipa/FreeFire.ipa
