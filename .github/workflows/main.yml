name: download-ff-ipa
on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Download and install ipatool
        run: |
          wget -q https://github.com/majd/ipatool/releases/download/v2.1.1/ipatool_2.1.1_linux_amd64.tar.gz
          tar -xzf ipatool_2.1.1_linux_amd64.tar.gz
          chmod +x ipatool
          sudo mv ipatool /usr/local/bin/

      - name: Auth with Apple ID
        env:
          APPLE_EMAIL: ${{ secrets.APPLE_EMAIL }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: |
          ipatool auth login -e "$APPLE_EMAIL" -p "$APPLE_PASSWORD"

      - name: Download Free Fire IPA
        run: |
          mkdir -p ipa
          ipatool download -b com.dts.freefireth -o ipa/FreeFire.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: freefire-original-ipa
          path: ipa/FreeFire.ipa
